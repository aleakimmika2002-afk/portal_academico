<!DOCTYPE html>
<html lang="es">

    <title>
        {% block titulo %}Portal Académico{% endblock %}
    </title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <header>
